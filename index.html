<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجمهورية الجزائرية الديمقراطية الشعبية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

    <div class="overlay"></div>

    <header class="top-header">
        <div class="logo-box">
            <img src="ministry-logo.jpg" alt="شعار وزارة المجاهدين" class="ministry-logo">
            <span class="logo-label">وزارة المجاهدين</span>
        </div>

        <div class="titles-box">
            <h1 class="main-country-title">الجمهورية الجزائرية الديمقراطية الشعبية</h1>
            <h2 class="sub-country-title">التاريخ كما يجب أن يكون</h2>
            
            <div class="revolution-era">
                <span class="era-years">1830 - 1962</span>
                <div class="blood-drops">
                    <span class="blood-drop drop-1"></span>
                    <span class="blood-drop drop-2"></span>
                    <span class="blood-drop drop-3"></span>
                </div>
            </div>
        </div>

        <div class="header-spacer"></div>
    </header>

    <!-- الأمواج الصوتية التفاعلية في الوسط -->
    <main class="waves-container" id="waves-trigger" title="اضغط لتشغيل أو إيقاف النشيد">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
    </main>

    <!-- المنطقة السفلية بالمستويات الثلاثة -->
    <footer class="bottom-section">
        <!-- المستوى 1: الأزرار المتقابلة -->
        <div class="action-buttons-row">
            <!-- اليمين: زر حول التطبيق -->
            <button class="about-mic-btn" id="about-btn" title="الاستماع إلى: حول التطبيق">
                <div class="mic-icon-box">
                    <svg class="mic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="22"></line>
                        <line x1="8" y1="22" x2="16" y2="22"></line>
                    </svg>
                    <div class="mic-pulse-ring"></div>
                </div>
                <span class="about-text">حول التطبيق</span>
            </button>

            <!-- اليسار: زر التخطي -->
           <a href="home.html" class="grenade-skip-btn" id="skip-btn" title="تخطي إلى الصفحة الرئيسية">
                <span class="skip-tooltip">تخطـي</span>
                <div class="grenade-wrapper">
                    <div class="spark spark-1"></div>
                    <div class="spark spark-2"></div>
                    <div class="spark spark-3"></div>
                    <div class="fuse-glow"></div>
                    
                    <svg class="grenade-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="23" cy="11" r="5" stroke="#d4af37" stroke-width="2.5" fill="none" />
                        <path d="M30 14H38V18H30Z" fill="#a37c15" stroke="#d4af37" stroke-width="1.5" />
                        <path d="M34 18V23" stroke="#d4af37" stroke-width="3" stroke-linecap="round" />
                        <path d="M37 15C42 16 46 22 46 28V36" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round" fill="none" />
                        <rect x="22" y="24" width="22" height="32" rx="10" fill="#1b2e1b" stroke="#d4af37" stroke-width="2" />
                        <line x1="22" y1="32" x2="44" y2="32" stroke="#d4af37" stroke-width="1.8" />
                        <line x1="22" y1="40" x2="44" y2="40" stroke="#d4af37" stroke-width="1.8" />
                        <line x1="22" y1="48" x2="44" y2="48" stroke="#d4af37" stroke-width="1.8" />
                        <line x1="29" y1="24" x2="29" y2="56" stroke="#d4af37" stroke-width="1.8" />
                        <line x1="37" y1="24" x2="37" y2="56" stroke="#d4af37" stroke-width="1.8" />
                    </svg>
                </div>
            </a>
        </div>

        <!-- المستوى 2: جملة المجد والخلود في الوسط بالأخضر -->
        <div class="martyrs-quote-row">
            <p class="martyrs-quote">المجد والخلود لشهدائنا الأبرار</p>
        </div>

        <!-- المستوى 3: اللاصقة في أقصى اليسار بدون إطار -->
        <div class="developer-badge-row">
            <div class="developer-badge" title="المطوّرة">
                <span class="badge-icon">💻</span>
                <span class="badge-text">برمجة وهندسة: <strong>رميلي زينة</strong></span>
            </div>
        </div>
    </footer>

    <!-- ملفات الصوت -->
    <audio id="anthem-player" loop>
        <source src="lime nationnale.mp3" type="audio/mpeg">
    </audio>

    <audio id="about-player">
        <source src="À propos de l'application.mp3" type="audio/mpeg">
    </audio>

    <script src="main.js"></script>
</body>
</html>
